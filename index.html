/* name scramble */
const CH='!<>-_\\/[]{}=+*^?#ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function scramble(el,txt){let f=0;const t=setInterval(()=>{el.textContent=txt.split('').map((c,i)=>c===' '?' ':i<f/2?c:CH[Math.random()*CH.length|0]).join('');if(++f>txt.length*2+2){el.textContent=txt;clearInterval(t)}},35)}
scramble($('#name'),D.name);
$('#name').onmouseenter=()=>scramble($('#name'),D.name);
$('#name').onclick=()=>scramble($('#name'),D.name);

/* typing roles */
let ri=0,ci=0,del=false;
(function type(){const w=D.roles[ri];$('#role').textContent=w.slice(0,ci);
 if(!del&&ci===w.length){del=true;return setTimeout(type,1400)}
 if(del&&ci===0){del=false;ri=(ri+1)%D.roles.length}
 ci+=del?-1:1;setTimeout(type,del?40:90)})();

/* particle background */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H,P=[];const M={x:-999,y:-999};
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(100,W/12|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}))}
rs();addEventListener('resize',rs);
addEventListener('mousemove',e=>{M.x=e.clientX;M.y=e.clientY});
(function draw(){cx.clearRect(0,0,W,H);
 for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
  const dm=Math.hypot(p.x-M.x,p.y-M.y);if(dm<140){p.x+=(p.x-M.x)*.02;p.y+=(p.y-M.y)*.02}
  cx.fillStyle='rgba(0,229,255,.7)';cx.beginPath();cx.arc(p.x,p.y,1.6,0,7);cx.fill()}
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
  if(d<120){cx.strokeStyle=`rgba(124,92,255,${(1-d/120)*.45})`;cx.beginPath();cx.moveTo(P[i].x,P[i].y);cx.lineTo(P[j].x,P[j].y);cx.stroke()}}
 requestAnimationFrame(draw)})();

/* 3D tilt + glow (delegated) */
document.addEventListener('mousemove',e=>{const c=e.target.closest&&e.target.closest('.tilt');if(!c)return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');
 c.style.transform=`perspective(800px) rotateY(${(x/r.width-.5)*12}deg) rotateX(${(.5-y/r.height)*12}deg) translateY(-6px)`});
document.addEventListener('mouseout',e=>{const c=e.target.closest&&e.target.closest('.tilt');if(c&&!c.contains(e.relatedTarget))c.style.transform=''});

function pdfBlob(){const b=atob(PDF_B64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:'application/pdf'})}
document.querySelectorAll('.dlb').forEach(btn=>btn.onclick=async()=>{
 const name='Prathmesh_Chaure_Resume.pdf';let d=null;
 try{d=window.claude&&await claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:name,data:pdfBlob()})}catch(e){}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(pdfBlob());a.download=name;document.body.appendChild(a);a.click();a.remove()});
